services:
  db:
    image: postgres:16
    container_name: clinicbook-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinicbook
    ports:
      - "5433:5432"
    volumes:
      - clinicbook_data:/var/lib/postgresql/data
    # Postgres accepts connections a few seconds after the container starts, so
    # the API has to wait for this probe instead of for the container itself.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinicbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: clinicbook-api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/clinicbook
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JPA_SHOW_SQL: "true"

volumes:
  clinicbook_data:
