services:
  db:
    image: postgres:16
    container_name: clinicbook-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinicbook
    ports:
      - "5433:5432"
    volumes:
      - clinicbook_data:/var/lib/postgresql/data

volumes:
  clinicbook_data: