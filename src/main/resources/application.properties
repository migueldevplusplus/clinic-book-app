spring.application.name=clinic-book

# Local development defaults. In any other environment these are overridden
# through the standard SPRING_DATASOURCE_* environment variables (see docker-compose.yml).
spring.datasource.url=jdbc:postgresql://localhost:5433/clinicbook
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate only checks the mapping against it and
# refuses to start on drift instead of altering tables on its own.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# The web layer returns DTOs and projections, never entities, so it has no reason
# to keep a Hibernate session open while the response is rendered.
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=6

# Serialize and parse dates, times and timestamps as ISO-8601
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
spring.mvc.format.time=iso

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
